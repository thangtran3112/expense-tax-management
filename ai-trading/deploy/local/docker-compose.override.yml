# Local-only overlay for the production compose file. Paths are relative to
# the first compose file (ai-trading/deploy/production/).
services:
  cloudflared:
    profiles: ["production-only"]

  router:
    image: caddy:2-alpine
    volumes:
      - ../local/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8899:8899"
    networks: [hub, ta, ahf, vibe, mirofish]
    depends_on:
      web:
        condition: service_started
      ta-terminal:
        condition: service_started
      ahf-terminal:
        condition: service_started
      vibe-trading:
        condition: service_started
      # MiroFish stays disabled (profile-gated) until its sibling compose
      # file is also passed with `-f` and its keys render; `required: false`
      # lets `router` start without it, same tolerance Task 5 proves for
      # production (see docker-compose.mirofish.yml).
      mirofish:
        condition: service_started
        required: false
