services:
  # ─── 1. Primary Relational & Vector DB (PostgreSQL 17 + pgvector) ───
  postgres:
    image: pgvector/pgvector:pg17
    container_name: expense-tax-postgres
    restart: unless-stopped
    ports:
      # Mac-side published port deliberately NOT 5432: a persistent Homebrew
      # postgres (user's other work) owns Mac localhost:5432, and the VPS
      # tunnel already takes 15432. Container side stays 5432 (all
      # container-network URLs unchanged); only host-side tools use 5433.
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: expense_tax_db
      # For multi-app: create additional DBs via init script
      POSTGRES_MULTIPLE_DATABASES: expense_tax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Gateway Ingress (Nginx 1.27+) ───
  nginx:
    image: nginx:1.27-alpine
    container_name: expense-tax-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
