services:
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: expense-tax-temporal
    restart: unless-stopped
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgrespassword
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    volumes:
      # The first Compose file is infrastructure/docker-compose.common.yml.
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [default]

  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: expense-tax-temporal-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_healthy
    networks: [default]
