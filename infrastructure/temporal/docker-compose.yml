services:
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: family-temporal
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      SKIP_DB_CREATE: "true"
      POSTGRES_USER: expense_temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    volumes:
      - ./dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development.yaml:ro
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [shared, database]

  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: family-temporal-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_healthy
    networks: [shared]

networks:
  shared:
    external: true
    name: family_shared
  database:
    external: true
    name: postgres_default
