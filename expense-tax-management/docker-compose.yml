services:
  # Expense Service — app-specific overlay, include common stack
  expense-service:
    build:
      context: ../expense-tax-management/expense-service
      dockerfile: Dockerfile
    container_name: expense-tax-expense-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/expense_tax_db
      SECRET_KEY: dev-secret-key-change-in-production-expense-tax-2026
      TEMPORAL_HOST: temporal:7233
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      STORAGE_BACKEND: local
    volumes:
      - ../expense-tax-management/expense-service:/app
      - expense_service_storage:/tmp/expense_tax_storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  postgres:
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_MIGRATOR_DB_PASSWORD: ${APP_MIGRATOR_DB_PASSWORD:?APP_MIGRATOR_DB_PASSWORD is required}
      APP_RUNTIME_DB_PASSWORD: ${APP_RUNTIME_DB_PASSWORD:?APP_RUNTIME_DB_PASSWORD is required}
      FOUNDRY_MIGRATOR_DB_PASSWORD: ${FOUNDRY_MIGRATOR_DB_PASSWORD:?FOUNDRY_MIGRATOR_DB_PASSWORD is required}
      FOUNDRY_RUNTIME_DB_PASSWORD: ${FOUNDRY_RUNTIME_DB_PASSWORD:?FOUNDRY_RUNTIME_DB_PASSWORD is required}
    volumes:
      - ../expense-tax-management/docker/postgres/zz-20-expense-tax-roles.sh:/docker-entrypoint-initdb.d/zz-20-expense-tax-roles.sh:ro

  app-api:
    build:
      context: ../expense-tax-management
      dockerfile: services/app-api/Dockerfile
    container_name: expense-tax-app-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      PORT: "8100"
      APP_VERSION: ${VERSION:-0.1.0}
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:-https://clerk.not-configured.invalid}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://clerk.not-configured.invalid/.well-known/jwks.json}
      CLERK_TENANT_AUDIENCE: ${CLERK_TENANT_AUDIENCE:-expense-app}
      CLERK_PLATFORM_AUDIENCE: ${CLERK_PLATFORM_AUDIENCE:-expense-foundry-platform}
      CLERK_APP_SERVICE_AUDIENCE: ${CLERK_APP_SERVICE_AUDIENCE:-mch_3J9fsniGga4hUqUf65ZQqzeGX2b}
      CLERK_FOUNDRY_SERVICE_AUDIENCE: ${CLERK_FOUNDRY_SERVICE_AUDIENCE:-mch_3J9g3CNoKL9q6KfbRy5zq1Rh2zT}
      CLERK_APP_SERVICE_SUBJECT: ${CLERK_APP_SERVICE_SUBJECT:-mch_3J9Xg9Hu84Rn2oeqj7EMrv0ax19}
      CLERK_FOUNDRY_SERVICE_SUBJECT: ${CLERK_FOUNDRY_SERVICE_SUBJECT:-mch_3J9gHBtDcxOE3fWE39Ay9uF7hFv}
      APP_TENANT_TOKEN_ISSUER: ${APP_TENANT_TOKEN_ISSUER:-https://identity.expense-tax.local}
      APP_TENANT_TOKEN_AUDIENCE: ${APP_TENANT_TOKEN_AUDIENCE:-expense-app}
      APP_TENANT_JWKS_URL: ${APP_TENANT_JWKS_URL:-https://identity.expense-tax.local/.well-known/jwks.json}
      APP_SERVICE_TOKEN_ISSUER: ${APP_SERVICE_TOKEN_ISSUER:-https://services.expense-tax.local}
      APP_SERVICE_TOKEN_AUDIENCE: ${APP_SERVICE_TOKEN_AUDIENCE:-expense-app-internal}
      APP_SERVICE_JWKS_URL: ${APP_SERVICE_JWKS_URL:-https://services.expense-tax.local/.well-known/jwks.json}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /tmp/expense_tax_storage
      # Content URLs leave the cluster (consumed by external clients via
      # the published loopback port), so the loopback-published address is
      # correct here -- unlike TEMPORAL_HOST, which is container-to-container.
      STORAGE_LOCAL_BASE_URL: ${STORAGE_LOCAL_BASE_URL:-http://127.0.0.1:8100}
      STORAGE_URL_SIGNING_KEY: ${STORAGE_URL_SIGNING_KEY:?STORAGE_URL_SIGNING_KEY is required}
      # Web session wiring design (2026-10-06): local defaults let
      # Capture/Office call App API cross-origin, and let the
      # containerized worker reach App API over the Compose network
      # instead of the loopback-only STORAGE_LOCAL_BASE_URL above.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:7301,http://localhost:7302}
      STORAGE_INTERNAL_BASE_URL: ${STORAGE_INTERNAL_BASE_URL:-http://app-api:8100}
      INBOUND_EMAIL_BASE_ADDRESS: ${INBOUND_EMAIL_BASE_ADDRESS:-receipts@inbound.expense-tax.local}
      INBOUND_WEBHOOK_SIGNING_KEY: ${INBOUND_WEBHOOK_SIGNING_KEY:?INBOUND_WEBHOOK_SIGNING_KEY is required}
      INBOUND_ROUTING_TOKEN_SECRET: ${INBOUND_ROUTING_TOKEN_SECRET:?INBOUND_ROUTING_TOKEN_SECRET is required}
      INBOUND_CHALLENGE_DIR: /tmp/expense_tax_inbound_challenges
    volumes:
      - expense_tax_storage:/tmp/expense_tax_storage
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8100/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  app-api-migrate:
    profiles:
      - phase-0i-migrations
    build:
      context: ../expense-tax-management
      dockerfile: services/app-api/Dockerfile
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    environment:
      APP_MIGRATION_DATABASE_URL: ${APP_MIGRATION_DATABASE_URL:?APP_MIGRATION_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  foundry-service:
    build:
      context: ../expense-tax-management
      dockerfile: services/foundry-service/Dockerfile
    container_name: expense-tax-foundry-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      PORT: "8200"
      APP_VERSION: ${VERSION:-0.1.0}
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:-https://clerk.not-configured.invalid}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://clerk.not-configured.invalid/.well-known/jwks.json}
      CLERK_TENANT_AUDIENCE: ${CLERK_TENANT_AUDIENCE:-expense-app}
      CLERK_PLATFORM_AUDIENCE: ${CLERK_PLATFORM_AUDIENCE:-expense-foundry-platform}
      CLERK_APP_SERVICE_AUDIENCE: ${CLERK_APP_SERVICE_AUDIENCE:-mch_3J9fsniGga4hUqUf65ZQqzeGX2b}
      CLERK_FOUNDRY_SERVICE_AUDIENCE: ${CLERK_FOUNDRY_SERVICE_AUDIENCE:-mch_3J9g3CNoKL9q6KfbRy5zq1Rh2zT}
      CLERK_APP_SERVICE_SUBJECT: ${CLERK_APP_SERVICE_SUBJECT:-mch_3J9Xg9Hu84Rn2oeqj7EMrv0ax19}
      CLERK_FOUNDRY_SERVICE_SUBJECT: ${CLERK_FOUNDRY_SERVICE_SUBJECT:-mch_3J9gHBtDcxOE3fWE39Ay9uF7hFv}
      FOUNDRY_PLATFORM_TOKEN_ISSUER: ${FOUNDRY_PLATFORM_TOKEN_ISSUER:-https://identity.expense-tax.local}
      FOUNDRY_PLATFORM_TOKEN_AUDIENCE: ${FOUNDRY_PLATFORM_TOKEN_AUDIENCE:-expense-foundry-platform}
      FOUNDRY_PLATFORM_JWKS_URL: ${FOUNDRY_PLATFORM_JWKS_URL:-https://identity.expense-tax.local/.well-known/jwks.json}
      FOUNDRY_SERVICE_TOKEN_ISSUER: ${FOUNDRY_SERVICE_TOKEN_ISSUER:-https://services.expense-tax.local}
      FOUNDRY_SERVICE_TOKEN_AUDIENCE: ${FOUNDRY_SERVICE_TOKEN_AUDIENCE:-expense-foundry-internal}
      FOUNDRY_SERVICE_JWKS_URL: ${FOUNDRY_SERVICE_JWKS_URL:-https://services.expense-tax.local/.well-known/jwks.json}
      FOUNDRY_DATABASE_URL: ${FOUNDRY_DATABASE_URL:?FOUNDRY_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  foundry-service-migrate:
    profiles:
      - phase-0i-migrations
    build:
      context: ../expense-tax-management
      dockerfile: services/foundry-service/Dockerfile
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    environment:
      FOUNDRY_MIGRATION_DATABASE_URL: ${FOUNDRY_MIGRATION_DATABASE_URL:?FOUNDRY_MIGRATION_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # Task 7 Stage C: the sole Temporal worker (the Python ai-worker is
  # removed). Started by `up -d` like any other service.
  workflow-worker:
    build:
      context: ../expense-tax-management
      dockerfile: services/workflow-worker/Dockerfile
    container_name: expense-tax-workflow-worker
    restart: unless-stopped
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: expense-tax
      AI_WORKER_TASK_QUEUE: expense-tax-processing
      APP_API_BASE_URL: http://app-api:8100
      FOUNDRY_BASE_URL: http://foundry-service:8200
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:-https://clerk.not-configured.invalid}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://clerk.not-configured.invalid/.well-known/jwks.json}
      CLERK_APP_SERVICE_AUDIENCE: ${CLERK_APP_SERVICE_AUDIENCE:-mch_3J9fsniGga4hUqUf65ZQqzeGX2b}
      CLERK_FOUNDRY_SERVICE_AUDIENCE: ${CLERK_FOUNDRY_SERVICE_AUDIENCE:-mch_3J9g3CNoKL9q6KfbRy5zq1Rh2zT}
      CLERK_APP_MACHINE_SECRET_KEY: ${CLERK_APP_MACHINE_SECRET_KEY:-not-yet-issued}
      CLERK_FOUNDRY_MACHINE_SECRET_KEY: ${CLERK_FOUNDRY_MACHINE_SECRET_KEY:-not-yet-issued}
      CLERK_APP_SERVICE_SUBJECT: ${CLERK_APP_SERVICE_SUBJECT:-mch_3J9Xg9Hu84Rn2oeqj7EMrv0ax19}
      CLERK_FOUNDRY_SERVICE_SUBJECT: ${CLERK_FOUNDRY_SERVICE_SUBJECT:-mch_3J9gHBtDcxOE3fWE39Ay9uF7hFv}
    depends_on:
      temporal:
        condition: service_healthy
      app-api:
        condition: service_healthy
      foundry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

  capture-web:
    build:
      context: ../expense-tax-management
      dockerfile: frontend/capture-web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5jb20k}
        NEXT_PUBLIC_APP_API_URL: ${NEXT_PUBLIC_APP_API_URL:-http://127.0.0.1:8100}
    container_name: expense-tax-capture-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:7301:7301"
    environment:
      PORT: "7301"
      HOSTNAME: "0.0.0.0"
    depends_on:
      app-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7301/capture >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  office-web:
    build:
      context: ../expense-tax-management
      dockerfile: frontend/office-web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5jb20k}
        NEXT_PUBLIC_APP_API_URL: ${NEXT_PUBLIC_APP_API_URL:-http://127.0.0.1:8100}
    container_name: expense-tax-office-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:7302:7302"
    environment:
      PORT: "7302"
      HOSTNAME: "0.0.0.0"
    depends_on:
      app-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7302/dashboard >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  foundry-web:
    build:
      context: ../expense-tax-management
      dockerfile: frontend/foundry-web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5jb20k}
    container_name: expense-tax-foundry-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:7303:7303"
    environment:
      PORT: "7303"
      HOSTNAME: "0.0.0.0"
    depends_on:
      foundry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7303/providers >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  expense_service_storage:
  expense_tax_storage:

networks:
  default:
    name: family-infra_default
