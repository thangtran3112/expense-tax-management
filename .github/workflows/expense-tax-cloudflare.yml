name: Expense Tax Cloudflare

on:
  pull_request:
    paths:
      - "infrastructure/cloudflare/**"
      - "infrastructure/vps/bootstrap-cloudflared.sh"
      - ".github/workflows/expense-tax-cloudflare.yml"
      - "expense-tax-management/infrastructure/gcp/expense-tax/bootstrap.sh"
      - "expense-tax-management/infrastructure/gcp/expense-tax/bootstrap-cloudflare.sh"
  push:
    branches:
      - main
    paths:
      - "infrastructure/cloudflare/**"
      - "infrastructure/vps/bootstrap-cloudflared.sh"
      - ".github/workflows/expense-tax-cloudflare.yml"
      - "expense-tax-management/infrastructure/gcp/expense-tax/bootstrap.sh"
      - "expense-tax-management/infrastructure/gcp/expense-tax/bootstrap-cloudflare.sh"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply Terraform changes to production Cloudflare
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: expense-tax-cloudflare-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Terraform PR validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init without backend
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform init -backend=false

      - name: Terraform fmt
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform validate

  plan:
    name: Terraform plan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CLOUDFLARE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDFLARE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform fmt
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform validate

      # Review-only plan. Saved plan files embed variable values and the prior
      # state (including the tunnel token), so plans never leave the job that
      # creates them; the apply job plans and applies within one job.
      - name: Terraform plan
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform plan

  apply:
    name: Terraform apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CLOUDFLARE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDFLARE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform plan
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infrastructure/cloudflare/expense-tax
        run: terraform apply -auto-approve tfplan
