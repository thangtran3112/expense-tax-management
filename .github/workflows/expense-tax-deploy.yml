name: Expense Tax Deploy

on:
  workflow_run:
    workflows: ["Expense Tax CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: expense-tax-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/thangtran3112/family-app

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: expense-tax-app-api
            dockerfile: expense-tax-management/services/app-api/Dockerfile
          - image: expense-tax-foundry-service
            dockerfile: expense-tax-management/services/foundry-service/Dockerfile
          - image: expense-tax-ai-worker
            dockerfile: expense-tax-management/services/ai-worker/Dockerfile
          - image: expense-tax-workflow-worker
            dockerfile: expense-tax-management/services/workflow-worker/Dockerfile
          - image: expense-tax-mailbox-broker
            dockerfile: expense-tax-management/services/mailbox-broker/Dockerfile
          - image: expense-tax-capture-web
            dockerfile: expense-tax-management/frontend/capture-web/Dockerfile
          - image: expense-tax-office-web
            dockerfile: expense-tax-management/frontend/office-web/Dockerfile
          - image: expense-tax-foundry-web
            dockerfile: expense-tax-management/frontend/foundry-web/Dockerfile
    steps:
      - name: Checkout completed CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: expense-tax-management
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy production
    needs: build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout completed CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Production env is not read here: the VPS loads it from Firestore
      # family-config at deploy time (common/config/family_config.py).
      - name: Install pinned SSH identity
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
          SSH_KEY_FILE: ${{ runner.temp }}/expense-tax-deploy-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/expense-tax-known-hosts
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$VPS_DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE"

      - name: Transfer production runtime
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/expense-tax-deploy-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/expense-tax-known-hosts
        run: |
          set -euo pipefail
          SSH_OPTIONS=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -p "$VPS_PORT")
          SCP_OPTIONS=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -P "$VPS_PORT")
          ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 0700 /tmp/expense-tax-deploy"
          scp "${SCP_OPTIONS[@]}" \
            expense-tax-management/deploy/production/docker-compose.yml \
            expense-tax-management/deploy/production/docker-compose.mailbox.yml \
            expense-tax-management/deploy/production/deploy.sh \
            expense-tax-management/deploy/production/health-check.sh \
            common/config/family_config.py \
            "$VPS_USER@$VPS_HOST:/tmp/expense-tax-deploy/"

      - name: Deploy over dedicated SSH identity
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/expense-tax-deploy-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/expense-tax-known-hosts
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GITHUB_TOKEN"
          SSH_OPTIONS=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -p "$VPS_PORT")
          printf '%s\n' "$GITHUB_TOKEN" | ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" \
            "read -r GH_TOKEN; set -Eeuo pipefail; DOCKER_CONFIG=/dev/shm/expense-tax-docker-config-\$\$; cleanup() { sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker logout ghcr.io >/dev/null 2>&1 || true; sudo rm -rf \"\$DOCKER_CONFIG\" /tmp/expense-tax-deploy; }; trap cleanup EXIT; sudo install -d -o root -g root -m 0700 \"\$DOCKER_CONFIG\"; printf '%s' \"\$GH_TOKEN\" | sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker login ghcr.io --username '${{ github.actor }}' --password-stdin; sudo install -d -m 0755 /opt/expense-tax-management/app; sudo install -o root -g root -m 0644 /tmp/expense-tax-deploy/docker-compose.yml /opt/expense-tax-management/app/docker-compose.yml; sudo install -o root -g root -m 0644 /tmp/expense-tax-deploy/docker-compose.mailbox.yml /opt/expense-tax-management/app/docker-compose.mailbox.yml; sudo install -o root -g root -m 0755 /tmp/expense-tax-deploy/deploy.sh /opt/expense-tax-management/app/deploy.sh; sudo install -o root -g root -m 0755 /tmp/expense-tax-deploy/health-check.sh /opt/expense-tax-management/app/health-check.sh; sudo install -o root -g root -m 0755 /tmp/expense-tax-deploy/family_config.py /opt/expense-tax-management/app/family_config.py; sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" IMAGE_TAG='$IMAGE_TAG' FAMILY_CONFIG_CREDENTIALS=/etc/family-app/config-reader.json /opt/expense-tax-management/app/family_config.py run expense-tax-management/production --env-file-var DEPLOY_ENV_FILE -- /opt/expense-tax-management/app/deploy.sh"

      - name: Clean remote staging
        if: always()
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/expense-tax-deploy-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/expense-tax-known-hosts
        run: |
          set +e
          SSH_OPTIONS=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -p "$VPS_PORT")
          ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" \
            'for config in /dev/shm/expense-tax-docker-config-*; do [ -d "$config" ] || continue; sudo env DOCKER_CONFIG="$config" docker logout ghcr.io >/dev/null 2>&1 || true; done; sudo rm -rf /dev/shm/expense-tax-docker-config-* /tmp/expense-tax-deploy' || true
          exit 0

      - name: Clean runner temporary files
        if: always()
        run: |
          rm -f \
            "${RUNNER_TEMP}/expense-tax-deploy-key" \
            "${RUNNER_TEMP}/expense-tax-known-hosts"
