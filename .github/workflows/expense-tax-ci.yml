name: Expense Tax CI

on:
  push:
    branches: [main, master]
    paths:
      - "expense-tax-management/**"
      - "common/config/**"
      - "infrastructure/docker-compose.common.yml"
      - ".github/workflows/expense-tax-ci.yml"
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-tax-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: expense-tax-management

jobs:
  quality:
    name: Contracts, services, workers, frontends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Frontend builds require a nonproduction public Clerk key; never use production credentials in CI.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Enforce feature source branch
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            feature/* | dependabot/*) ;;
            *)
              echo "Pull requests to dev must originate from feature/* or dependabot/*; got: $HEAD_REF"
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: expense-tax-management/pnpm-lock.yaml
      - name: Frozen Node install
        run: pnpm install --frozen-lockfile
      - name: Build contract runtime
        run: pnpm --filter @expense-tax/contracts build
      - name: Generated contract drift
        run: pnpm contracts:check
      - name: TypeScript lint
        run: pnpm ci:lint
      - name: TypeScript typecheck
        run: pnpm ci:typecheck
      - name: Unit tests
        run: pnpm ci:test
      - name: Production builds
        run: pnpm ci:build

  integration:
    name: Postgres, Temporal, cross-language, Docker
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Capture production builds require a nonproduction public Clerk key; never use production credentials in CI.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: expense-tax-management/pnpm-lock.yaml
      - name: Install toolchains
        run: pnpm install --frozen-lockfile
      - name: Start Docker-local PostgreSQL
        run: ./scripts/compose.sh up -d --wait postgres
      - name: Initialize service schemas
        run: |
          ./scripts/compose.sh run --rm app-api-migrate
          ./scripts/compose.sh run --rm foundry-service-migrate
      - name: Full zero-skip phase chain
        env:
          PHASE_0I_INTEGRATION: "1"
          PHASE_0J_INTEGRATION: "1"
          PHASE_0J_WAVE2_INTEGRATION: "1"
          PHASE_0J_WAVE3_INTEGRATION: "1"
          PHASE_0J_WAVE4_INTEGRATION: "1"
          PHASE_0J1_INTEGRATION: "1"
          PHASE_0K_WAVE_A_INTEGRATION: "1"
          PHASE_0K_WAVE_B_INTEGRATION: "1"
          PHASE_0L_INTEGRATION: "1"
          PHASE_0D_INTEGRATION: "1"
          PHASE_0C_INTEGRATION: "1"
          PHASE_0E_INTEGRATION: "1"
          PHASE_0P_INTEGRATION: "1"
          PHASE_0N_INTEGRATION: "1"
        run: pnpm verify:phase-0n
      - name: Capture compose diagnostics
        if: failure()
        run: ./scripts/compose.sh logs --no-color > ci-compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: expense-tax-compose-diagnostics
          path: expense-tax-management/ci-compose.log
          retention-days: 7

  no-deploy:
    name: Deployment gate remains closed
    needs: [quality, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI verified. No deployment action is configured; 1B/1C require explicit approval."
        working-directory: .
