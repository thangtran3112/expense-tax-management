name: ai-trading-deploy

on:
  push:
    branches: [main]
    paths:
      - "ai-trading/**"
      - "!ai-trading/plans/**"
      - "!ai-trading/**/*.md"
      - ".gitmodules"
      - ".github/workflows/ai-trading-deploy.yml"
      - "infrastructure/secrets/**"
  workflow_dispatch:

concurrency:
  group: ai-trading-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: tobytran-portfolio
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/807362265280/locations/global/workloadIdentityPools/ai-trading-deploy/providers/github
  GCP_DEPLOY_SERVICE_ACCOUNT: ai-trading-deploy@tobytran-portfolio.iam.gserviceaccount.com

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build images for smoke tests
        uses: docker/bake-action@v7
        env:
          TAG: ci
        with:
          files: |
            ai-trading/deploy/docker-bake.hcl
            ai-trading/deploy/docker-bake.ci.hcl
          load: true
      - name: Smoke tests
        env:
          TAG: ci
        run: ai-trading/deploy/ci/smoke-test.sh all
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push immutable images
        uses: docker/bake-action@v7
        env:
          TAG: ${{ github.sha }}
        with:
          files: |
            ai-trading/deploy/docker-bake.hcl
          push: true

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ai-trading-production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ai-trading/deploy/production
            ai-trading/deploy/ci
            infrastructure/secrets
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Render production env files
        run: ai-trading/deploy/ci/render-env.sh "$RUNNER_TEMP/ai-trading-env"

      - name: Fetch OVH deploy SSH key
        run: |
          python3 infrastructure/secrets/env-bundle.py get-file \
            expense-tax-env-files ovh/github-actions-expense-tax "$RUNNER_TEMP/ssh-key"

      - name: Deploy over SSH
        env:
          GHCR_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.sha }}
          SSH_KEY_FILE: ${{ runner.temp }}/ssh-key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/ai-trading-known-hosts
          ENV_DIR: ${{ runner.temp }}/ai-trading-env
        run: |
          set -euo pipefail
          echo "::add-mask::$GITHUB_TOKEN"
          DEPLOY_SCRIPT="$RUNNER_TEMP/deploy-remote.sh"
          cat >"$DEPLOY_SCRIPT" <<'SCRIPT_EOF'
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$VPS_KNOWN_HOSTS" >"$KNOWN_HOSTS_FILE"
          ssh_opts=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -p "$VPS_PORT")
          scp_opts=(-i "$SSH_KEY_FILE" -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes -P "$VPS_PORT")
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 0700 /tmp/ai-trading-deploy /tmp/ai-trading-deploy/env"
          scp "${scp_opts[@]}" \
            ai-trading/deploy/production/docker-compose.yml \
            ai-trading/deploy/production/deploy.sh \
            ai-trading/deploy/production/health-check.sh \
            "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/"
          scp "${scp_opts[@]}" "$ENV_DIR"/*.env "$VPS_USER@$VPS_HOST:/tmp/ai-trading-deploy/env/"
          # shellcheck disable=SC2029 # GHCR_USER and IMAGE_TAG expand on the runner on purpose
          printf '%s\n' "$GITHUB_TOKEN" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "read -r GH_TOKEN; set -Eeuo pipefail; DOCKER_CONFIG=/dev/shm/ai-trading-docker-config-\$\$; cleanup() { sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker logout ghcr.io >/dev/null 2>&1 || true; sudo rm -rf \"\$DOCKER_CONFIG\" /tmp/ai-trading-deploy; }; trap cleanup EXIT; sudo install -d -o root -g root -m 0700 \"\$DOCKER_CONFIG\"; printf '%s' \"\$GH_TOKEN\" | sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" docker login ghcr.io --username '$GHCR_USER' --password-stdin; sudo install -d -m 0755 /opt/family-app/ai-trading; sudo install -o root -g root -m 0644 /tmp/ai-trading-deploy/docker-compose.yml /opt/family-app/ai-trading/docker-compose.yml; sudo install -o root -g root -m 0755 /tmp/ai-trading-deploy/deploy.sh /opt/family-app/ai-trading/deploy.sh; sudo install -o root -g root -m 0755 /tmp/ai-trading-deploy/health-check.sh /opt/family-app/ai-trading/health-check.sh; sudo env DOCKER_CONFIG=\"\$DOCKER_CONFIG\" IMAGE_TAG='$IMAGE_TAG' ENV_STAGING_DIR=/tmp/ai-trading-deploy/env /opt/family-app/ai-trading/deploy.sh"
          SCRIPT_EOF
          python3 infrastructure/secrets/env-bundle.py exec ai-trading deploy -- bash "$DEPLOY_SCRIPT"

      - name: Remove runner deploy material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ssh-key" "$RUNNER_TEMP/ai-trading-known-hosts" \
            "$RUNNER_TEMP/ai-trading-env" "$RUNNER_TEMP/deploy-remote.sh"
