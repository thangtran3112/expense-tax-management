version: 2
updates:
  # ai-trading upstream apps (git submodules under ai-trading/packages/), bundled
  # into one weekly pull request to dev.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: "chore(ai-trading)"
    groups:
      ai-trading-upstream:
        patterns:
          - "*"
    ignore:
      # Vibe-Trading is a family-app fork (ai-trading/packages/vibe-trading/DIVERGENCE.md).
      # Dependabot would move the pin to the fork's stale main and drop every patch.
      # Upstream updates go through the sync-vibe-trading skill instead.
      - dependency-name: "ai-trading/packages/vibe-trading"
